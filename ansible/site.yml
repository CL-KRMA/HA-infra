---
# ============================================================
# site.yml - Playbook orchestrateur du projet HA-infra
#
# S'execute depuis le dossier ansible/ (ou ansible.cfg pointe
# vers ./hosts, present dans ce meme dossier).
#
# Usage :
#   cd ansible
#   ansible-playbook site.yml                      -> tout deployer
#   ansible-playbook site.yml --tags k3s            -> uniquement k3s
#   ansible-playbook site.yml --skip-tags guestbook -> tout sauf la demo
#
# TLS (Let's Encrypt) : l'etape cert-manager necessite un email de
# contact valide. A fournir via --extra-vars, sinon la valeur par
# defaut "changeme@domain.com" du playbook est utilisee (a eviter
# en usage reel) :
#   ansible-playbook site.yml -e letsencrypt_email=TON_VRAI_EMAIL@TON_DOMAINE.com
#
# Prerequis : terraform apply deja fait (voir scripts/update-ip.sh),
# hosts deja mis a jour (voir scripts/update-hosts.sh),
# terraform/keys/ma-cle-ssh en 600.
#
# NB : install-terraform.yml n'est PAS inclus ici car il s'execute
# sur localhost, en amont, pour outiller la machine de controle
# (voir README.md). Il se lance separement si besoin :
#   ansible-playbook playbooks/install-terraform.yml
# ============================================================

- name: "Etape 1 - Cluster K3s HA (3 masters + 3 workers)"
  import_playbook: playbooks/install-k3s.yml
  tags: k3s

- name: "Etape 2 - cert-manager + Let's Encrypt (TLS)"
  import_playbook: playbooks/install-cert-manager.yml
  tags: cert-manager

- name: "Etape 3 - ArgoCD (GitOps)"
  import_playbook: playbooks/install-argocd.yml
  tags: argocd

- name: "Etape 4 - Monitoring (Prometheus + Grafana)"
  import_playbook: playbooks/install-monitoring.yml
  tags: monitoring

- name: "Etape 5 - Application de demo (guestbook via ArgoCD)"
  import_playbook: playbooks/guestbook.yml
  tags: guestbook
