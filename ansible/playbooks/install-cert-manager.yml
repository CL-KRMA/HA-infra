---
# ============================================================
# install-cert-manager.yml
#
# Installe cert-manager (Helm) et cree deux ClusterIssuer Let's
# Encrypt (staging + prod) utilisant le challenge HTTP-01 via
# l'IngressClass "traefik" deja presente dans k3s.
#
# Pre-requis IMPORTANT :
#   - Le DNS de argocd.domain.com et monitoring.domain.com doit
#     DEJA pointer vers l'IP publique de master1 (EIP) avant de
#     lancer ce playbook : le challenge HTTP-01 est valide par
#     Let's Encrypt en HTTP (port 80) depuis l'exterieur.
#   - Le port 80 doit rester ouvert dans le security group
#     (c'est deja le cas, voir terraform/main.tf).
#
# Variable a definir : letsencrypt_email (email de contact Let's
# Encrypt, utilise pour les alertes d'expiration). A passer via
# --extra-vars ou a modifier ci-dessous.
#
# Usage :
#   ansible-playbook site.yml --tags cert-manager \
#     -e letsencrypt_email=TON_VRAI_EMAIL@TON_DOMAINE.com
# ============================================================

- name: Installer cert-manager et configurer Let's Encrypt
  hosts: "{{ groups['master'][0] }}"
  become: yes
  vars:
    kube_user: "ubuntu"
    kubeconfig_path: "/home/ubuntu/.kube/config"
    helm_version: "v3.15.4"
    cert_manager_version: "v1.15.3"
    # A personnaliser (obligatoire pour Let's Encrypt) :
    letsencrypt_email: "changeme@domain.com"

  tasks:
    # --- Garde-fou : refuse de continuer avec un email placeholder ou
    #     un domaine reserve (example.com/org/net), rejete explicitement
    #     par Let's Encrypt (erreur ACME invalidContact sinon) ---
    - name: Verifier que letsencrypt_email est une vraie adresse (pas un placeholder)
      assert:
        that:
          - letsencrypt_email != "changeme@domain.com"
          - letsencrypt_email is not search("@example\\.(com|org|net)$")
        fail_msg: >-
          letsencrypt_email="{{ letsencrypt_email }}" est un placeholder
          ou un domaine reserve (example.com/org/net), rejete par Let's
          Encrypt (erreur ACME invalidContact). Relance avec une vraie
          adresse : -e letsencrypt_email=ton.email@tondomaine.com
        success_msg: "letsencrypt_email semble valide."

    # --- Installer Helm (idempotent, version pinnee) ---
    - name: Telecharger script d'installation Helm
      get_url:
        url: "https://raw.githubusercontent.com/helm/helm/{{ helm_version }}/scripts/get-helm-3"
        dest: /tmp/get_helm.sh
        mode: '0755'

    - name: Installer Helm
      command: /tmp/get_helm.sh
      args:
        creates: /usr/local/bin/helm
      environment:
        DESIRED_VERSION: "{{ helm_version }}"

    # --- Ajouter repo Jetstack (idempotent) ---
    - name: Ajouter le repo Helm Jetstack (cert-manager)
      command: helm repo add jetstack https://charts.jetstack.io
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Mettre a jour les repos Helm
      command: helm repo update
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Installer/mettre a jour cert-manager (avec ses CRDs) ---
    - name: Deployer/mettre a jour cert-manager via Helm
      command: >
        helm upgrade --install cert-manager jetstack/cert-manager
        --namespace cert-manager --create-namespace
        --version {{ cert_manager_version }}
        --set crds.enabled=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Attendre que les pods cert-manager soient prets
      command: kubectl get pods -n cert-manager
      register: cm_pods
      retries: 20
      delay: 15
      until: "'ContainerCreating' not in cm_pods.stdout and 'Pending' not in cm_pods.stdout"
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Attendre que le webhook cert-manager soit disponible
      command: kubectl wait --for=condition=Available --timeout=120s deployment/cert-manager-webhook -n cert-manager
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- ClusterIssuer Let's Encrypt STAGING (pour tester sans
    #     epuiser le rate-limit de prod pendant les premiers essais) ---
    - name: Deployer le ClusterIssuer letsencrypt-staging
      copy:
        dest: /tmp/clusterissuer-staging.yaml
        content: |
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-staging
          spec:
            acme:
              server: https://acme-staging-v02.api.letsencrypt.org/directory
              email: {{ letsencrypt_email }}
              privateKeySecretRef:
                name: letsencrypt-staging-account-key
              solvers:
                - http01:
                    ingress:
                      ingressClassName: traefik

    - name: Appliquer le ClusterIssuer letsencrypt-staging
      command: kubectl apply -f /tmp/clusterissuer-staging.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- ClusterIssuer Let's Encrypt PROD (utilise par les Ingress
    #     ArgoCD et Grafana via l'annotation cert-manager.io/cluster-issuer) ---
    - name: Deployer le ClusterIssuer letsencrypt-prod
      copy:
        dest: /tmp/clusterissuer-prod.yaml
        content: |
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: {{ letsencrypt_email }}
              privateKeySecretRef:
                name: letsencrypt-prod-account-key
              solvers:
                - http01:
                    ingress:
                      ingressClassName: traefik

    - name: Appliquer le ClusterIssuer letsencrypt-prod
      command: kubectl apply -f /tmp/clusterissuer-prod.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Verifier que les ClusterIssuer sont prets (Ready=True)
      command: kubectl get clusterissuer -o wide
      register: issuers
      retries: 10
      delay: 10
      until: "'True' in issuers.stdout"
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - debug:
        msg: "{{ issuers.stdout_lines }}"

    - name: Resume cert-manager
      debug:
        msg: |
          cert-manager installe, ClusterIssuer "letsencrypt-staging" et
          "letsencrypt-prod" prets.

          Les Ingress ArgoCD et Grafana (etapes suivantes) utilisent
          automatiquement letsencrypt-prod via l'annotation
          cert-manager.io/cluster-issuer.

          Rappel : le DNS de argocd.domain.com et monitoring.domain.com
          doit deja pointer vers l'IP publique de master1
          ({{ ansible_host }}) pour que le challenge HTTP-01 reussisse.
