---
# ============================================================
# Playbook K3s HA - 3 masters (etcd embarque) + 3 workers, repartis
# sur 3 AZ (voir terraform/main.tf, var az_count). IPs privees
# fixes definies dans ansible/hosts (192.168.2.10/74/138 pour les
# masters, 192.168.3.10/74/138 pour les workers - une IP par AZ,
# voir les commentaires du fichier hosts pour le detail du calcul).
# Masters avec EIP (acces public), workers en IP privee uniquement
# (SSH via ProxyJump defini dans hosts, fonctionne quelle que soit
# l'AZ du worker cible grace au routage natif entre subnets d'un
# meme VPC).
#
# Regle : le trafic INTERNE du cluster (join etcd, K3S_URL) utilise
# systematiquement les IP PRIVEES (node_private_ip), jamais les IP
# publiques des masters.
#
# CORRECTIONS apportees :
#   - Play 2 : serial: 1 pour joindre les masters etcd un par un
#     (evite les race conditions sur le quorum etcd)
#   - Play 2/3 : wait_for sur le port 6443 / 10250 au lieu de
#     s'appuyer sur le statut immediat du module systemd
#   - Play 2 : verification kubectl get nodes (Ready) apres chaque
#     jointure de master, avant de passer au suivant
# ============================================================

# ------------------------------------------------------------
# Play 1 : Premier master - initialise le cluster (cluster-init)
# ------------------------------------------------------------
- name: Installer le premier master K3s (cluster-init)
  hosts: "{{ groups['master'][0] }}"
  become: yes
  vars:
    k3s_version: "v1.30.4+k3s1"
    kube_user: "ubuntu"
    kube_group: "kube"

  tasks:
    - name: Installer dependances
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: Creer groupe kube si absent
      group:
        name: "{{ kube_group }}"
        state: present

    - name: Ajouter utilisateur {{ kube_user }} au groupe kube
      user:
        name: "{{ kube_user }}"
        groups: "{{ kube_group }}"
        append: yes

    - name: Installer k3s (premier master, cluster-init)
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} \
        sh -s - server --cluster-init \
        {% for h in groups['master'] %}--tls-san {{ hostvars[h].node_private_ip }} --tls-san {{ hostvars[h].ansible_host }} {% endfor %} \
        --node-ip {{ node_private_ip }} \
        --node-name {{ inventory_hostname }} \
        --write-kubeconfig-group {{ kube_group }}
      args:
        creates: /etc/rancher/k3s/k3s.yaml
      no_log: true

    - name: Attendre que k3s soit pret (fichier node-token genere)
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 90

    - name: Attendre que le port API 6443 soit disponible
      wait_for:
        port: 6443
        host: "{{ node_private_ip }}"
        timeout: 120

    - name: Recuperer le token k3s
      command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token
      changed_when: false
      no_log: true

    - name: Exposer le token et l'URL de jonction pour les plays suivantes
      set_fact:
        k3s_join_token: "{{ k3s_token.stdout }}"
        k3s_join_url: "https://{{ node_private_ip }}:6443"
      no_log: true

    - name: Creer le repertoire .kube pour {{ kube_user }}
      file:
        path: /home/{{ kube_user }}/.kube
        state: directory
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0755'

    - name: Copier la configuration k3s pour {{ kube_user }}
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/{{ kube_user }}/.kube/config
        remote_src: yes
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0640'

    # --- IMPORTANT : /home/{{ kube_user }}/.kube/config GARDE
    #     127.0.0.1 comme adresse de serveur. Ce fichier est utilise
    #     par TOUS les kubectl/helm executes DEPUIS master1 dans les
    #     playbooks suivants (cert-manager, argocd, monitoring...).
    #     Le remplacer par l'IP publique casserait ces appels : AWS
    #     ne supporte pas le hairpin NAT (une instance ne peut pas se
    #     joindre elle-meme via sa propre IP publique/EIP - le
    #     paquet part par l'IGW mais ne peut pas revenir). D'ou un
    #     kubeconfig SEPARE, uniquement pour un usage EXTERNE (depuis
    #     ta machine, qui n'a pas ce probleme de hairpin).
    - name: Creer un kubeconfig EXTERNE (IP publique) pour acces depuis ta machine
      copy:
        src: /home/{{ kube_user }}/.kube/config
        dest: /home/{{ kube_user }}/.kube/config-external
        remote_src: yes
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0640'

    - name: Remplacer l'adresse localhost par l'IP publique (kubeconfig externe uniquement)
      replace:
        path: /home/{{ kube_user }}/.kube/config-external
        regexp: '127\.0\.0\.1'
        replace: '{{ ansible_host }}'

    - name: Ajouter KUBECONFIG (interne, 127.0.0.1) dans le .bashrc de {{ kube_user }}
      lineinfile:
        path: "/home/{{ kube_user }}/.bashrc"
        line: 'export KUBECONFIG=/home/{{ kube_user }}/.kube/config'
        state: present

    - name: Verifier que le cluster est pret
      command: kubectl get nodes
      register: result
      retries: 10
      delay: 15
      until: result.rc == 0
      changed_when: false
      environment:
        KUBECONFIG: /home/{{ kube_user }}/.kube/config

    - name: Afficher comment recuperer le kubeconfig externe
      debug:
        msg: |
          Cluster K3s pret. Pour piloter le cluster DEPUIS TA MACHINE
          (et non depuis master1), recupere le kubeconfig externe :

            scp -i terraform/keys/ma-cle-ssh \
              ubuntu@{{ ansible_host }}:/home/{{ kube_user }}/.kube/config-external \
              ./kubeconfig-{{ inventory_hostname }}

          Puis : export KUBECONFIG=./kubeconfig-{{ inventory_hostname }}
                 kubectl get nodes

          (Le fichier /home/{{ kube_user }}/.kube/config sur master1,
          lui, garde 127.0.0.1 : c'est celui utilise par les playbooks
          suivants qui executent kubectl/helm depuis master1 lui-meme -
          AWS ne permet pas a une instance de se joindre via sa propre
          IP publique.)

# ------------------------------------------------------------
# Play 2 : Masters additionnels - rejoignent le cluster existant
# serial: 1 => un master a la fois pour ne pas fragiliser le
# quorum etcd pendant les jointures concurrentes.
# ------------------------------------------------------------
- name: Installer les masters additionnels (join HA)
  hosts: "master:!{{ groups['master'][0] }}"
  become: yes
  serial: 1
  vars:
    k3s_version: "v1.30.4+k3s1"
    kube_user: "ubuntu"
    kube_group: "kube"
    first_master: "{{ groups['master'][0] }}"

  tasks:
    - name: Installer dependances
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: Creer groupe kube si absent
      group:
        name: "{{ kube_group }}"
        state: present

    - name: Installer k3s (master additionnel, rejoint le cluster via IP privee)
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} \
        sh -s - server \
        --server {{ hostvars[first_master].k3s_join_url }} \
        --token {{ hostvars[first_master].k3s_join_token }} \
        {% for h in groups['master'] %}--tls-san {{ hostvars[h].node_private_ip }} --tls-san {{ hostvars[h].ansible_host }} {% endfor %} \
        --node-ip {{ node_private_ip }} \
        --node-name {{ inventory_hostname }} \
        --write-kubeconfig-group {{ kube_group }}
      args:
        creates: /etc/rancher/k3s/k3s.yaml
      no_log: true

    - name: Verifier que le service k3s est demarre
      systemd:
        name: k3s
        state: started

    - name: Attendre que le port API 6443 local soit disponible
      wait_for:
        port: 6443
        host: "{{ node_private_ip }}"
        timeout: 180

    - name: Attendre que ce master rejoigne etcd et apparaisse Ready
      command: kubectl get node {{ inventory_hostname }} --no-headers
      register: node_status
      retries: 15
      delay: 10
      until: node_status.rc == 0 and 'Ready' in node_status.stdout
      changed_when: false
      environment:
        KUBECONFIG: /home/{{ kube_user }}/.kube/config
      delegate_to: "{{ first_master }}"

# ------------------------------------------------------------
# Play 3 : Workers - rejoignent le cluster en tant qu'agents
# (SSH via ProxyJump defini dans inventory.ini, cible master1)
# ------------------------------------------------------------
- name: Installer les workers K3s (agents)
  hosts: worker
  become: yes
  vars:
    k3s_version: "v1.30.4+k3s1"
    first_master: "{{ groups['master'][0] }}"

  tasks:
    - name: Installer dependances
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: Installer k3s agent (worker, rejoint via IP privee)
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} \
        K3S_URL={{ hostvars[first_master].k3s_join_url }} \
        K3S_TOKEN={{ hostvars[first_master].k3s_join_token }} \
        K3S_NODE_IP={{ node_private_ip }} \
        K3S_NODE_NAME={{ inventory_hostname }} \
        sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service
      no_log: true

    - name: Verifier que le service k3s-agent est demarre
      systemd:
        name: k3s-agent
        state: started

    - name: Attendre que le kubelet du worker reponde (port 10250)
      wait_for:
        port: 10250
        host: "{{ node_private_ip }}"
        timeout: 120

# ------------------------------------------------------------
# Play 4 : Verification finale depuis le premier master
# ------------------------------------------------------------
- name: Verifier l'etat final du cluster
  hosts: "{{ groups['master'][0] }}"
  become: yes
  vars:
    kube_user: "ubuntu"

  tasks:
    - name: Attendre que tous les noeuds soient enregistres et Ready
      command: kubectl get nodes --no-headers
      register: all_nodes
      retries: 15
      delay: 10
      until: >
        all_nodes.rc == 0 and
        (all_nodes.stdout_lines | select('search', 'Ready') | list | length) ==
        (groups['master'] | length + groups['worker'] | length)
      changed_when: false
      environment:
        KUBECONFIG: /home/{{ kube_user }}/.kube/config

    - name: Lister tous les noeuds du cluster (3 masters + 3 workers attendus)
      command: kubectl get nodes -o wide
      register: final_nodes
      changed_when: false
      environment:
        KUBECONFIG: /home/{{ kube_user }}/.kube/config

    - name: Afficher le resultat
      debug:
        var: final_nodes.stdout_lines