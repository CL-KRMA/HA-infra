[defaults]
# Inventaire du projet (fichier "hosts", pas "inventory.ini")
inventory = ./hosts

# Desactiver la verification des cles SSH (necessaire ici : les instances EC2
# generent de nouvelles cles d'hote a chaque apply, et le ProxyJump vers les
# workers rendrait la confirmation manuelle penible)
host_key_checking = False

# Sortie lisible (nouvelle syntaxe, remplace l'ancien callback community.general.yaml)
stdout_callback = default
result_format = yaml

# Parallelisme (10 est large pour 6 noeuds, mais ne pose pas de probleme)
forks = 10

# Utilisateur SSH par defaut (evite de le repeter dans l'inventaire)
remote_user = ubuntu
